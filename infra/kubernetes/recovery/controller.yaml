apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-controller
  namespace: canary-mvp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-controller
  namespace: canary-mvp
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    resourceNames: ["application-route"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["application-v1"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-controller
  namespace: canary-mvp
subjects:
  - kind: ServiceAccount
    name: recovery-controller
    namespace: canary-mvp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recovery-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-controller
  namespace: canary-mvp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-controller
    spec:
      serviceAccountName: recovery-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: recovery-controller:phase6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
