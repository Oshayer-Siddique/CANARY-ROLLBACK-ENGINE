apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      scrape_timeout: 4s

    rule_files:
      - /etc/prometheus/canary.rules.yml

    scrape_configs:
      - job_name: canary-application-pods
        metrics_path: /metrics
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [canary-mvp]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: canary-demo-application
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: release
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
            target_label: app_version
  canary.rules.yml: |
    groups:
      - name: canary-release-health
        interval: 5s
        rules:
          - record: canary:request_rate_60s
            expr: sum by (version) (rate(requests_total{job="canary-application-pods",method="GET",route="/"}[60s]))
          - record: canary:error_rate_ratio_60s
            expr: sum by (version) (rate(http_errors_total{job="canary-application-pods",route="/"}[60s])) / clamp_min(sum by (version) (rate(requests_total{job="canary-application-pods",method="GET",route="/"}[60s])), 0.000001)
          - record: canary:error_percentage_60s
            expr: 100 * canary:error_rate_ratio_60s
          - alert: CanaryErrorRateHigh
            expr: (canary:error_percentage_60s{version="v2"} > 5) and (canary:request_rate_60s{version="v2"} >= 0.05)
            labels:
              severity: warning
              release: canary
            annotations:
              summary: Canary v2 error rate is above 5 percent
              description: The v2 request error percentage has exceeded 5 percent over the rolling 60-second window with at least three requests.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: canary-rollback-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: canary-rollback-engine
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
