apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application-route
  namespace: canary-mvp
spec:
  parentRefs:
    - name: canary-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: application-stable
          port: 80
          weight: 100
        - name: application-canary
          port: 80
          weight: 0
